<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookstorium</title>
  <link rel="stylesheet" href="assets/bootstrap 5.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
<nav style="background-color: #005a5b" class="navbar navbar-expand-lg shadow-lg">
  <div class="container">
    <a href="index.html" class="text-white navbar-brand fw-bold">
      <img src="assets/images/Book-image.png" alt="Kitap İkonu" width="40" height="40" class="me-2" />
      Bookstorium
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <form class="d-flex mx-auto my-2 my-lg-0" style="width: 100%; max-width: 500px;">
        <div class="input-group">
          <input type="search" class="form-control" placeholder="Kitap, yazar veya kategori ara..." aria-label="Arama">
          <button class="btn btn-outline-light" type="submit">
            <i class="fas fa-search"></i> Ara
          </button>
        </div>
      </form>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white me-3" href="#" id="favoritesDropdown" role="button" data-bs-toggle="dropdown">
            <i class="fas fa-heart"></i> Favoriler <span class="badge bg-danger">0</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
          </ul>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white me-3" href="#" id="cartDropdown" role="button" data-bs-toggle="dropdown">
            <i class="fas fa-shopping-cart"></i> Sepet <span class="badge bg-success">0</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" style="min-width: 300px;">
          </ul>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
            <i class="fas fa-user"></i> Hesap
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" style="background-color: #005a5b;">
        <h5 class="modal-title text-white">Giriş Yap</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="loginEmail" class="form-label">E-posta</label>
            <input type="email" class="form-control" id="loginEmail" required>
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Şifre</label>
            <input type="password" class="form-control" id="loginPassword" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Beni Hatırla</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
        <button type="button" class="btn" style="background-color: #005a5b; color: white;">Giriş Yap</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="signupModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" style="background-color: #005a5b;">
        <h5 class="modal-title text-white">Üye Ol</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="signupName" class="form-label">Ad Soyad</label>
            <input type="text" class="form-control" id="signupName" required>
          </div>
          <div class="mb-3">
            <label for="signupEmail" class="form-label">E-posta</label>
            <input type="email" class="form-control" id="signupEmail" required>
          </div>
          <div class="mb-3">
            <label for="signupPassword" class="form-label">Şifre</label>
            <input type="password" class="form-control" id="signupPassword" required>
          </div>
          <div class="mb-3">
            <label for="signupPasswordConfirm" class="form-label">Şifre Tekrar</label>
            <input type="password" class="form-control" id="signupPasswordConfirm" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="acceptTerms" required>
            <label class="form-check-label" for="acceptTerms">Kullanım şartlarını kabul ediyorum</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
        <button type="button" class="btn" style="background-color: #005a5b; color: white;">Üye Ol</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="deleteAccountModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger">
        <h5 class="modal-title text-white">Hesap Silme</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger">
          <strong>Dikkat!</strong> Bu işlem geri alınamaz. Hesabınız kalıcı olarak silinecektir.
        </div>
        <form>
          <div class="mb-3">
            <label for="deletePassword" class="form-label">Şifrenizi doğrulayın</label>
            <input type="password" class="form-control" id="deletePassword" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="confirmDelete" required>
            <label class="form-check-label" for="confirmDelete">Hesabımı silmek istediğimi onaylıyorum</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
        <button type="button" class="btn btn-danger">Hesabı Sil</button>
      </div>
    </div>
  </div>
</div>

<div class="container py-5">
  <div class="products-container">
    <div class="row g-4" id="book-list-row">
    </div>
  </div>
</div>

<script src="assets/bootstrap 5.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/javascript/main.js"></script>
</body>
</html>
