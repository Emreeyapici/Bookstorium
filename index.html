<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstorium</title>
    <link rel="stylesheet" href="bootstrap-4.6.2-dist/css/bootstrap.min.css">

    <style>
        .navbar-custom {
          background-color: #6f42c1; /* Mor renk */
        }
        .card-img-top {
      height: 200px;
      object-fit: cover;
        }
        .logout-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      background-color: #dc3545; /* Kırmızı renk */
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    }
    .logout-btn:hover {
      background-color: #c82333; /* Hover efekti */
    }
    .delete-account-btn {
      position: fixed;
      bottom: 80px; /* Çıkış yap butonunun hemen üstüne */
      right: 20px;
      padding: 10px 20px;
      background-color: #ffc107; /* Sarı renk */
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    }
    .delete-account-btn:hover {
      background-color: #e0a800; /* Hover efekti */
    }
    .favorite-btn {
      background-color: #ff6f61; /* Kırmızımsı renk */
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s;
    }

    .favorite-btn:hover {
      background-color: #e04e43; /* Hover rengi */
    }
    /* Sepete Git Butonu */
    .go-to-cart-btn {
      position: fixed;
      bottom: 140px; /* Diğer butonların üstüne */
      right: 20px;
      padding: 15px 25px;
      background-color: #28a745; /* Yeşil renk */
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    }
    .go-to-cart-btn:hover {
      background-color: #218838; /* Hover efekti */
    }
      </style>
    
</head>

<body>
    
    <nav class="navbar navbar-expand-lg navbar-custom navbar-dark">
        <div class="container">
          <!-- Logo -->
          <a class="navbar-brand" href="index.html">Bookstorium</a>
          
          <!-- Arama Çubuğu -->
          <form class="form-inline mx-auto">
            <input class="form-control mr-sm-2" type="search" placeholder="Ürün Ara" aria-label="Search">
            <button class="btn btn-outline-light my-2 my-sm-0" type="submit">Ara</button>
          </form>
          
          <!-- Üye Ol ve Giriş Yap Butonları -->
          <div class="ml-auto">
            <a href="giris.html">
                <button class="btn btn-outline-light mr-2" type="button">Üye Ol</button>
                <button class="btn btn-outline-light" type="button">Giriş Yap</button>
            </a>
          </div>
        </div>
      </nav>

      <!-- Ürün Kartları -->
  <div class="container my-5">
    <div class="row">
      <!-- Ürün 1 -->
      <div class="col-md-4 mb-4">
        <div class="card position-relative">
          <img src="image/0000000105599-1.jpg" class="card-img-top" alt="Ürün 1">
          <div class="card-body">
            <h5 class="card-title">Harry Potter Felsefe Taşı</h5>
            <p class="card-text">Harry Potter serisinin ilk kitabı olan Felsefe Taşı sizi fantastik bir öykünün içine çekecek. </p>
            <p class="card-text"><strong>Fiyat: 100₺</strong></p>
            <button class="btn btn-primary">Sepete Ekle</button>
          </div>
          <!-- Favoriye Ekle Butonu -->
          <button class="favorite-btn">Favoriye Ekle</button>
        </div>
      </div>
      
      <!-- Ürün 2 -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="image/dfee7b91-56e5-448b-9b5c-d1f5a471ffe5.__CR13,60,973,602_PT0_SX970_V1___.jpeg" class="card-img-top" alt="Ürün 2">
          <div class="card-body">
            <h5 class="card-title">Simyacı</h5>
            <p class="card-text">Okunması gereken klasiklerden.</p>
            <p class="card-text"><strong>Fiyat: 150₺</strong></p>
            <button class="btn btn-primary">Sepete Ekle</button>
          </div>
          <!-- Favoriye Ekle Butonu -->
          <button class="favorite-btn">Favoriye Ekle</button>
        </div>
      </div>
      
      <!-- Ürün 3 -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="image/Kucukprens.jpg" class="card-img-top" alt="Ürün 3">
          <div class="card-body">
            <h5 class="card-title">Küçük Prens</h5>
            <p class="card-text">Küçük Prensin maceralarına haydi siz de eşlik edin.</p>
            <p class="card-text"><strong>Fiyat: 200₺</strong></p>
            <button class="btn btn-primary">Sepete Ekle</button>
          </div>
          <!-- Favoriye Ekle Butonu -->
          <button class="favorite-btn">Favoriye Ekle</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hesabı Sil Butonu -->
  <button class="delete-account-btn">Hesabı Sil</button>

  <!-- Çıkış Yap Butonu -->
  <button class="logout-btn">Çıkış Yap</button>

  <!-- Sepete Git Butonu -->

  <a href="sepet.html">
    <button class="go-to-cart-btn">Sepete Git</button>
  </a>





    <script src="bootstrap-4.6.2-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
